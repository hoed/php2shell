; PHP2Shell Sentinel — Safe lab configuration (mitigated settings)
; Based on official PHP advisory recommendations

; CVE-2026-109618 mitigation
memory_limit = -1

; CVE-2026-109619 mitigations
session.upload_progress.enabled = 0
fatal_error_backtraces = 0

; Reduce information disclosure
expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/1/fd/2
